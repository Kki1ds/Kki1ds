name: Generate Snake

on:
  schedule:
    - cron: "17 */12 * * *" # 每 12 小时更新一次（避开整点高峰）
  workflow_dispatch:        # 允许手动触发
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml # 修改本文件后立即重新生成

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 蛇：Claude 橙 #D97757；格子：One Dark 蓝色阶，与顶部打字动画的 #61AFEF 呼应
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D97757&color_dots=#ebedf0,#c6dbf5,#8dbdff,#4b91f1,#2f74b5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D97757&color_dots=#161b22,#0e2a47,#1a4a7a,#2f74b5,#61AFEF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
